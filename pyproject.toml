[tool.poetry]
name = "fastdfe"
version = "1.4.0"
description = "Fast and flexible inference of the distribution of fitness effects (DFE), VCF-SFS parsing with ancestral allele and site-degeneracy annotation."
authors = ["Sendrowski <sendrowski.janek@gmail.com>"]
license = "GPL-3.0-or-later"
readme = "README.md"

[tool.poetry.dependencies]
python = ">=3.10,<3.14"
typing-extensions = "^4.5.0"
matplotlib = "^3.9"
seaborn = "^0.13.2"
numpy = ">=1.24,<3"
pandas = "^2.2.2"
jsonpickle = "^3.0.0"
multiprocess = "^0.70.12"
pyyaml = "^6.0"
tqdm = "^4.60.0"
mpmath = "^1.3.0"
biopython = "^1.84"
requests = ">=2.28"
scipy = "^1.13"

# SFS parsing, stratification, filtration and annotation live in sfsutils.
# The `vcf` extra pulls sfsutils[vcf] (cyvcf2) for VCF support.
sfsutils = [
    { version = "^1.0.0" },
    { version = "^1.0.0", extras = ["vcf"], optional = true },
]

[tool.poetry.extras]
vcf = ["sfsutils"]

[tool.poetry.group.dev.dependencies]
urllib3 = "^2.5.0"
sphinx_book_theme = "^1.1.2"
sphinx-autodoc-typehints = "^2.1.0"
sphinx-copybutton = "^0.5.2"
myst-nb = "^1.1.0"
sphinx = "^7.3.7"
pygments = "^2.15.1"
sphinxcontrib-bibtex = "^2.6.2"
autodocsumm = "^0.2.15"
cyvcf2 = "^0.31.0"

[build-system]
requires = ["poetry-core"]
build-backend = "poetry.core.masonry.api"
