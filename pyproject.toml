[tool.poetry]
name = "fastdfe"
version = "1.4.1"
description = "Fast and flexible inference of the distribution of fitness effects (DFE), VCF-SFS parsing with ancestral allele and site-degeneracy annotation."
authors = ["Janek Sendrowski <sendrowski.janek@gmail.com>"]
license = "GPL-3.0-or-later"
readme = "README.md"

[tool.poetry.dependencies]
python = ">=3.11,<3.14"
typing-extensions = "^4.5.0"
matplotlib = "^3.9"
seaborn = "^0.13.2"
numpy = ">=1.24,<3"
pandas = "^2.2.2"
jsonpickle = "^3.0.0"
multiprocess = "^0.70.12"
pyyaml = "^6.0"
tqdm = "^4.60.0"
mpmath = "^1.3.0"
scipy = "^1.13"

# SFS parsing, stratification, filtration and annotation live in sfsutils, published on PyPI as
# `sfsutils-popgen` (the `sfsutils` name is an unrelated package); it is imported as `sfsutils`.
sfsutils-popgen = "^1.0.0"

# Optional input backends, mirroring the sfsutils extras of the same names: cyvcf2 for VCF,
# zarr for VCF-Zarr stores, tskit for tree sequences (ARGs). Declared directly rather than as
# sfsutils-popgen[vcf,zarr,arg] because poetry cannot express a dependency that is both required
# and carries an optional extra: listing the package under [tool.poetry.extras] tags every entry
# of a multiple-constraints dependency, pushing the base requirement behind the extra marker as
# well (this broke the 1.4.0 release).
cyvcf2 = { version = ">=0.31,<1", optional = true }
zarr = { version = ">=3.1", optional = true }
tskit = { version = ">=0.5", optional = true }

[tool.poetry.extras]
vcf = ["cyvcf2"]
zarr = ["zarr"]
arg = ["tskit"]

[tool.poetry.group.dev.dependencies]
urllib3 = "^2.5.0"
sphinx_book_theme = "~1.3.0"  # cap <1.4: 1.4.0 (pydata-sphinx-theme 0.20) breaks the mobile sidebar toggle
sphinx-autodoc-typehints = "^2.1.0"
sphinx-copybutton = "^0.5.2"
myst-nb = "^1.1.0"
sphinx = "^7.3.7"
pygments = "^2.15.1"
sphinxcontrib-bibtex = "^2.6.2"
autodocsumm = "^0.2.15"
cyvcf2 = "^0.31.0"

[build-system]
requires = ["poetry-core"]
build-backend = "poetry.core.masonry.api"
