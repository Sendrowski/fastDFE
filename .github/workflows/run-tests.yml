# Run the fast and inference tiers (-m "not slow") on Linux, macOS and Windows with Python 3.11, and
# on Linux with 3.12 to 3.14, on every push to master, or manually. The slow tier (live polyDFE
# runs, large-data comparisons) runs locally. Dependencies are installed with uv (no conda).

name: tests

on:
  push:
    branches: [master]
    paths-ignore: ['docs/**', '**.md', '**.rst']
  workflow_dispatch:

permissions:
  contents: read

env:
  # one BLAS thread per xdist worker, so the workers do not oversubscribe the runner's cores
  OPENBLAS_NUM_THREADS: 1
  OMP_NUM_THREADS: 1

jobs:
  test:
    name: run tests on ${{ matrix.os }} with Python ${{ matrix.python }}
    runs-on: ${{ matrix.os }}
    # 3.14 is outside the declared range and runs for information only
    continue-on-error: ${{ matrix.experimental == true }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
        python: ["3.11"]
        include:
          - os: ubuntu-latest
            python: "3.12"
          - os: ubuntu-latest
            python: "3.13"
          - os: ubuntu-latest
            python: "3.14"
            experimental: true
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
      - name: Admit the experimental Python version
        if: matrix.experimental == true
        shell: bash
        run: sed -i -E 's/<3\.14"/<3.15"/' pyproject.toml
      - uses: astral-sh/setup-uv@v5
        with:
          enable-cache: true
      - name: Install fastdfe + test deps
        run: uv pip install --system -e ".[vcf]" pytest pytest-xdist pytest-timeout pytest-sugar dadi
      - name: Run tests
        run: pytest -n auto -m "not slow" testing/
