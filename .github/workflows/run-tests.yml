# Run the fast (unit) test suite on Linux, macOS and Windows on every push to master, or manually.
# The unit tier is the pytest.ini default marker filter (-m "not inference and not slow");
# the inference/slow tiers depend on local resources (genomes, SLiM, polyDFE) and are run
# locally, not on CI. Dependencies are installed with uv (no conda).

name: tests

on:
  push:
    branches: [master]
    paths-ignore: ['docs/**', '**.md', '**.rst']
  workflow_dispatch:

permissions:
  contents: read

env:
  # one BLAS thread per xdist worker, so the workers do not oversubscribe the runner's cores
  OPENBLAS_NUM_THREADS: 1
  OMP_NUM_THREADS: 1

jobs:
  test:
    name: run tests on ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - uses: astral-sh/setup-uv@v5
        with:
          enable-cache: true
      - name: Install fastdfe + test deps
        run: uv pip install --system -e ".[vcf]" pytest pytest-xdist pytest-timeout pytest-sugar dadi
      - name: Run tests
        run: pytest -n auto testing/
