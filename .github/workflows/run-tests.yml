# Run the fast (unit) test suite with coverage on every push to master.
# The unit tier is the pytest.ini default marker filter (-m "not inference and not slow");
# the inference/slow tiers depend on local resources (genomes, SLiM, polyDFE) and are run
# locally, not on CI. Dependencies are installed with uv (no conda).

name: Run tests

on:
  push:
    branches: [master]
    paths-ignore: ['docs/**', '**.md', '**.rst']

permissions:
  contents: read

jobs:
  # Import the package from a plain, extra-less install of the built wheel. The test job below
  # installs ".[vcf]", so it cannot catch a runtime dependency that is only reachable through an
  # extra; that is how 1.4.0 shipped with sfsutils-popgen behind the vcf marker and no importable
  # base install.
  import:
    name: import bare install on ubuntu
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - uses: astral-sh/setup-uv@v5
        with:
          enable-cache: true
      - name: Build wheel
        run: uv build --wheel
      - name: Install wheel without extras and import
        run: |
          uv venv /tmp/bare
          uv pip install --python /tmp/bare/bin/python dist/*.whl
          /tmp/bare/bin/python -c "import fastdfe; print(fastdfe.__version__)"

  test:
    name: run tests on ubuntu
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - uses: astral-sh/setup-uv@v5
        with:
          enable-cache: true
      - name: Install fastdfe + test deps
        run: uv pip install --system -e ".[vcf]" pytest pytest-xdist pytest-sugar dadi
      - name: Run tests
        run: pytest -n auto testing/
